  <!-- Ładowanie konwertera HEIC z dwóch alternatywnych źródeł -->
  <script type="module">
    window.heicModuleReady = (async () => {
      const sources = [
        "https://cdn.jsdelivr.net/npm/heic-to@1.6.5/+esm",
        "https://esm.sh/heic-to@1.6.5"
      ];

      let lastError = null;

      for (const source of sources) {
        try {
          const module = await import(source);
          const converter = module.heicTo || module.default;

          if (typeof converter === "function") {
            window.heicToConverter = converter;
            return converter;
          }
        } catch (error) {
          lastError = error;
          console.warn(
            "Nie udało się załadować modułu HEIC:",
            source,
            error
          );
        }
      }

      throw (
        lastError ||
        new Error("Nie udało się załadować modułu HEIC.")
      );
    })();
  </script>
